name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy llm/ memory/ tools/ runtime/ errors/ config/ observability/ --ignore-missing-imports

      - name: Test with pytest
        env:
          API_KEY: ci-test-key
          MODEL: ci-test-model
          BASE_URL: https://ci-test.example.com
        run: pytest tests/ --cov --cov-report=term-missing --tb=short
