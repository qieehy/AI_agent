[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.3.0"
description = "Production-grade Agent Framework with Runtime, Tool, Memory, RAG, MCP, Multi-Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qieehy" }]
keywords = ["agent", "llm", "ai", "tool-calling", "rag", "mcp"]

dependencies = [
    "openai>=2.46.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jsonschema>=4.18",
    "tiktoken>=0.7",
    "loguru>=0.7",
    "rich>=13.0",
    "typer>=0.12",
    "httpx>=0.27",
    "tavily-python>=0.5",
    "numpy>=1.26",
    "pypdf>=4.0.0"

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "fpdf2>=2.7",
]
rag = [
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]
mcp = [
    "mcp>=1.0",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
agent = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm*", "memory*", "tools*", "runtime*", "config*", "errors*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

# numpy 2.5+ stub 使用 PEP 695 (type 语句) 语法，需要 mypy python_version >= 3.12 才能解析。
# 代码的 3.10 运行时兼容性由 CI 矩阵（pytest 3.10/3.11/3.12）兜底。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: integration tests requiring real LLM API",
]
